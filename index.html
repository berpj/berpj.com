<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>berpj.com</title>
  <meta property="og:title" content="berpj.com" />
  <meta property="og:description" content="Random things." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://berpj.com" />
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="berpj.com">
  <meta name="twitter:description" content="Random things.">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: black;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    #emoji, #emoji2, #emoji4 {
      position: absolute;
      font-size: 65px;
      line-height: 38px;
      will-change: transform;
    }
  </style>
</head>
<body>
  <a href="/bangkok-past-and-present" id="emoji">📷</a>
  <a href="/cat" id="emoji2">🐱</a>
  <a href="/longtail/" id="emoji4" aria-label="Play Longtail After Dark" title="Longtail After Dark">🚤</a>

  <script>
    const emojis = [
      {
        el: document.getElementById('emoji'),
        x: 100,
        y: 100,
        dx: 2,
        dy: 2,
        radius: 30,
      },
      {
        el: document.getElementById('emoji2'),
        x: 300,
        y: 200,
        dx: -1.5,
        dy: 1.8,
        radius: 30,
      },
      {
        el: document.getElementById('emoji4'),
        x: 420,
        y: 260,
        dx: -2.1,
        dy: 1.6,
        radius: 30,
      },
    ];

    function bounce() {
      const winWidth = window.innerWidth;
      const winHeight = window.innerHeight;

      emojis.forEach(e => {
        if (e.x + e.radius * 2 >= winWidth || e.x <= 0) e.dx = -e.dx;
        if (e.y + e.radius * 2 >= winHeight || e.y <= 0) e.dy = -e.dy;

        e.x += e.dx;
        e.y += e.dy;

        if (e.x < 0) e.x = 0;
        if (e.x + e.radius * 2 > winWidth) e.x = winWidth - e.radius * 2;
        if (e.y < 0) e.y = 0;
        if (e.y + e.radius * 2 > winHeight) e.y = winHeight - e.radius * 2;
      });

      for (let i = 0; i < emojis.length; i++) {
        for (let j = i + 1; j < emojis.length; j++) {
          const e1 = emojis[i];
          const e2 = emojis[j];

          const centerX1 = e1.x + e1.radius;
          const centerY1 = e1.y + e1.radius;
          const centerX2 = e2.x + e2.radius;
          const centerY2 = e2.y + e2.radius;
          
          const distance = Math.sqrt((centerX2 - centerX1) ** 2 + (centerY2 - centerY1) ** 2);
          const minDistance = e1.radius + e2.radius;
          
          if (distance < minDistance) {
            const tempDx = e1.dx;
            const tempDy = e1.dy;
            e1.dx = e2.dx;
            e1.dy = e2.dy;
            e2.dx = tempDx;
            e2.dy = tempDy;
            
            const overlap = minDistance - distance;
            const separationX = (centerX2 - centerX1) / distance;
            const separationY = (centerY2 - centerY1) / distance;
            
            e1.x -= (separationX * overlap) / 2;
            e1.y -= (separationY * overlap) / 2;
            e2.x += (separationX * overlap) / 2;
            e2.y += (separationY * overlap) / 2;
          }
        }
      }

      emojis.forEach(e => {
        e.el.style.transform = `translate(${e.x}px, ${e.y}px)`;
      });

      requestAnimationFrame(bounce);
    }

    bounce();
  </script>
</body>
</html>
