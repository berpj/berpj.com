  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .emoji {
      position: absolute;
      font-size: 4rem;
      cursor: pointer;
      transition: transform 0.1s;
    }

    #scoreboard, #instructions, #timer {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      background: #007bff;
      padding: 10px 20px;
      border-radius: 10px;
      box-shadow: 2px 2px 5px rgba(255,255,255,0.2);
      user-select: none;
    }

    #scoreboard { top: 10px; }
    #instructions { top: 70px; font-size: 1rem; }
    #timer { bottom: 10px; font-size: 1rem; }

    #startButton {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      padding: 20px 40px;
      background: #007bff;
      border: none;
      border-radius: 15px;
      box-shadow: 3px 3px 8px rgba(255,255,255,0.3);
      cursor: pointer;
      user-select: none;
      transition: background-color 0.3s;
    }
    #startButton:hover {
      background-color: #0056b3;
    }
  </style>

    <button id="startButton">Start</button>
  </div>

    const timerDisplay = document.getElementById('timer');
    const instructions = document.getElementById('instructions');
    const startButton = document.getElementById('startButton');

    let score = 0;
    let moveTimeout;
    let gameTime = 15;
    let allPositions = [];
    let timerInterval;

    function getRandomPosition() {
      let attempts = 0;
      while (attempts < 100) {
        const maxX = window.innerWidth - 80;
        const maxY = window.innerHeight - 80;
        const x = Math.random() * maxX;
        const y = Math.random() * maxY;
        const newArea = { x, y, width: 80, height: 80 };
        const overlap = allPositions.some(pos => {
          return !(
            pos.x + pos.width < newArea.x ||
            pos.x > newArea.x + newArea.width ||
            pos.y + pos.height < newArea.y ||
            pos.y > newArea.y + newArea.height
          );
        });
        if (!overlap) {
          allPositions.push(newArea);
          return { x, y };
        }
        attempts++;
      }
      return { x: 0, y: 0 };
    }

    function getRandomWrongEmoji() {
      const wrongEmojis = ['😾', '🐶', '😿', '💩', '🙀'];
      return wrongEmojis[Math.floor(Math.random() * wrongEmojis.length)];
    }

    function createEmoji(type) {
      const emoji = document.createElement('div');
      emoji.classList.add('emoji');
      emoji.textContent = type === 'cat' ? '😺' : getRandomWrongEmoji();
      const { x, y } = getRandomPosition();
      emoji.style.left = `${x}px`;
      emoji.style.top = `${y}px`;
      game.appendChild(emoji);

      emoji.addEventListener('click', () => {
        if (type === 'cat') {
          score++;
          scoreboard.textContent = `Score: ${score}`;
          winAudio.currentTime = 0; // rewind sound to start
          winAudio.play();
          emoji.remove();
          spawnEmojis();
        } else {
          endGame("Game Over! You clicked the wrong emoji. YOU SUCK!");
        }
      });
    }

    function spawnEmojis() {
      clearTimeout(moveTimeout);
      document.querySelectorAll('.emoji').forEach(e => e.remove());
      allPositions = [];
      createEmoji('cat');
      const numberOfWrong = 3 + Math.floor(score / 5);
      for (let i = 0; i < numberOfWrong; i++) {
        createEmoji('wrong');
      }
      moveTimeout = setTimeout(spawnEmojis, 1500);
    }

    function startTimer() {
      timerDisplay.textContent = `Time left: ${gameTime}s`;
      timerInterval = setInterval(() => {
        gameTime--;
        timerDisplay.textContent = `Time left: ${gameTime}s`;
        if (gameTime <= 0) {
          clearInterval(timerInterval);
          endGame(`Time's up! Your score: ${score}`);
        }
      }, 1000);
    }

    function endGame(message) {
        if (message.includes('wrong')) {
      loseAudio.currentTime = 0;
      loseAudio.play();
        }

      clearTimeout(moveTimeout);
      clearInterval(timerInterval);
      document.querySelectorAll('.emoji').forEach(e => e.remove());
      instructions.textContent = "Game over!";

      
      setTimeout(() => {
        alert(message);
        }, 250)

      startButton.style.display = "block";
    }

    function startGame() {
      score = 0;
      gameTime = 15;
      scoreboard.textContent = `Score: ${score}`;
      instructions.textContent = "Click the 😺 but avoid the other emojis!";
      startButton.style.display = "none";
      spawnEmojis();
      startTimer();
      winAudio.currentTime = 0; // rewind sound to start
      winAudio.play();
    }

    // Initially hide game elements except start button
    timerDisplay.style.display = "none";

    startButton.addEventListener('click', () => {
      // Show game UI on start
      timerDisplay.style.display = "block";
      startGame();
    });
  </script>
</body>
</html>
