<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bangkok, past and present</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: black;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    body {
      width: 90vw;
    }

    .slider img {
      height: auto!important;
      max-height: 75vh;
      max-width: 90vw;
    }

    h1 {
      margin: 30px 0 20px;
      font-size: 1.8rem;
      text-align: center;
      font-weight: 300;
    }

    .description {
      margin-bottom: 30px;
      font-size: 1rem;
      color: #ccc;
      text-align: center;
      max-width: 90%;
      margin-top: 0px;
      padding-top: 5px;
      font-weight: 100;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/before-after-slider@1.0.0/dist/slider.bundle.js"></script>
</head>
<body>
  <h1>Bangkok, past and present</h1>

  <div id="slider1" class="slider"></div>
  <p class="description">#1: Intersection between Song Sawat Road and Yaowarat Road, Bangkok.<br> (1912 and 2025)</p>

  <div id="slider2" class="slider"></div>
  <p class="description">#2: Maitri Chit Junction, Bangkok.<br> (1950 and 2025)</p>

  <script>
    new SliderBar({
      el: '#slider1',
      beforeImg: '/before-1.jpg',
      afterImg: '/after-1.jpg',
      width: "100%",
      line: true,
      lineColor: "rgba(255,255,255,0.5)"
    });

    new SliderBar({
      el: '#slider2',
      beforeImg: 'https://placehold.co/800x400?text=BKK+Before+2',
      afterImg: 'https://placehold.co/800x400?text=BKK+After+2',
      width: "100%",
      line: true,
      lineColor: "rgba(255,255,255,0.5)"
    });
  </script>
</body>
</html>
